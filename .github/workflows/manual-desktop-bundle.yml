name: Manual Windows desktop bundle\n\non:\n  workflow_dispatch:\n\njobs:\n  desktop-bundle:\n    runs-on: windows-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Install Rust\n        shell: pwsh\n        run: |\n          rustup toolchain install stable --profile minimal\n          rustup default stable\n\n      - name: Download pinned dependency archives\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force embedded | Out-Null\n          Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-windows-x86_64.zip' -OutFile 'embedded/cmake.zip'\n          Invoke-WebRequest -Uri 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip' -OutFile 'embedded/ninja.zip'\n          Invoke-WebRequest -Uri 'https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-mingw-w64-i686-arm-none-eabi.zip' -OutFile 'embedded/arm-gcc.zip'\n          Invoke-WebRequest -Uri 'https://github.com/raspberrypi/pico-sdk/archive/refs/tags/2.3.1.zip' -OutFile 'embedded/pico-sdk.zip'\n          Invoke-WebRequest -Uri 'https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.1-0/picotool-2.3.1-x64-win.zip' -OutFile 'embedded/picotool.zip'\n\n      - name: Verify bundled archive checksums\n        shell: pwsh\n        run: |\n          $expected = @{\n            'embedded/cmake.zip' = '4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab'\n            'embedded/ninja.zip' = '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'\n            'embedded/arm-gcc.zip' = 'b40db54536d2fdf0ff21f4316b56c1fc4d3b782b792c5b298bcbeaf5eccedb96'\n            'embedded/picotool.zip' = '68730be0813f8f35be2cca147cf7f1572662d5dcf0f5ba468e02a6dd9e85db2b'\n          }\n          foreach ($item in $expected.GetEnumerator()) {\n            $actual = (Get-FileHash $item.Key -Algorithm SHA256).Hash.ToLower()\n            if ($actual -ne $item.Value) { throw "Checksum mismatch: $($item.Key)" }\n          }\n\n      - name: Build self-contained desktop EXE\n        shell: pwsh\n        env:\n          PICO_BUNDLE_DIR: ${{ github.workspace }}\embedded\n        run: cargo build --release --locked\n\n      - name: Package desktop application\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force dist | Out-Null\n          Copy-Item target/release/pico-build.exe dist/pico-build.exe\n          (Get-FileHash dist/pico-build.exe -Algorithm SHA256).Hash | Set-Content dist/pico-build.exe.sha256\n          Compress-Archive -Path dist/pico-build.exe,dist/pico-build.exe.sha256 -DestinationPath pico-build-windows-x64.zip -Force\n\n      - name: Upload desktop build\n        uses: actions/upload-artifact@v4\n        with:\n          name: pico-build-windows-x64-self-contained\n          path: pico-build-windows-x64.zip\n          if-no-files-found: error\n