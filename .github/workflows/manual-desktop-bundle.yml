name: Manual Windows desktop bundle

on:
  workflow_dispatch:

jobs:
  desktop-bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable-msvc

      - name: Build Tauri 2 desktop application
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2.11.0" --locked
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-desktop-build.ps1
          cargo tauri build

      - name: Package desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Copy-Item target/release/bundle/nsis/*.exe dist/pico-build-tool-windows-x64-setup.exe -Force
          (Get-FileHash dist/pico-build-tool-windows-x64-setup.exe -Algorithm SHA256).Hash | Set-Content dist/pico-build-tool-windows-x64-setup.exe.sha256
          Compress-Archive -Path dist/* -DestinationPath pico-build-tool-windows-x64.zip -Force

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: pico-build-tool-windows-x64-tauri2
          path: pico-build-tool-windows-x64.zip
          if-no-files-found: error
