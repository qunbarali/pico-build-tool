name: Manual Windows desktop bundle

on:
  workflow_dispatch:

jobs:
  desktop-bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download pinned dependency archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force embedded | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-windows-x86_64.zip' -OutFile 'embedded/cmake.zip'
          Invoke-WebRequest -Uri 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip' -OutFile 'embedded/ninja.zip'
          Invoke-WebRequest -Uri 'https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-mingw-w64-i686-arm-none-eabi.zip' -OutFile 'embedded/arm-gcc.zip'
          Invoke-WebRequest -Uri 'https://github.com/raspberrypi/pico-sdk/archive/refs/tags/2.3.1.zip' -OutFile 'embedded/pico-sdk.zip'
          Invoke-WebRequest -Uri 'https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.1-0/picotool-2.3.1-x64-win.zip' -OutFile 'embedded/picotool.zip'

      - name: Verify bundled archive checksums
        shell: pwsh
        run: |
          $expected = @{
            'embedded/cmake.zip' = '4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab'
            'embedded/ninja.zip' = '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'
            'embedded/arm-gcc.zip' = 'b40db54536d2fdf0ff21f4316b56c1fc4d3b782b792c5b298bcbeaf5eccedb96'
            'embedded/picotool.zip' = '68730be0813f8f35be2cca147cf7f1572662d5dcf0f5ba468e02a6dd9e85db2b'
          }
          foreach ($item in $expected.GetEnumerator()) {
            $actual = (Get-FileHash $item.Key -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $item.Value) { throw "Checksum mismatch: $($item.Key)" }
          }

      - name: Build self-contained desktop EXE
        shell: pwsh
        env:
          PICO_BUNDLE_DIR: ${{ github.workspace }}\embedded
        run: cargo build --release

      - name: Package desktop application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pico-build.exe dist/pico-build.exe
          (Get-FileHash dist/pico-build.exe -Algorithm SHA256).Hash | Set-Content dist/pico-build.exe.sha256
          Compress-Archive -Path dist/pico-build.exe,dist/pico-build.exe.sha256 -DestinationPath pico-build-windows-x64.zip -Force

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: pico-build-windows-x64-self-contained
          path: pico-build-windows-x64.zip
          if-no-files-found: error
