[package]
name = "pico-build-tool"
version = "1.3.0"
edition = "2021"
authors = ["Pico Build Tool Contributors"]
description = "Standalone Rust build tool for Raspberry Pi Pico and Pico 2 projects"
license = "MIT"

[[bin]]
name = "pico-build"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
git2 = "0.20"
home = "0.5"
indicatif = "0.18"
log = "0.4"
reqwest = { version = "0.12", default-features = true, features = ["stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread"] }
toml = "0.9"
url = "2.5"
walkdir = "2.5"
zip = "6.0"

[dev-dependencies]
mockito = "1.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
